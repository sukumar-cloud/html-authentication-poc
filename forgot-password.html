<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password Page</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100">
        <div class="auth-card fade-in">
            <div class="text-center mb-4">
                <div class="mb-3">
                    <i class="bi bi-key-fill" style="font-size: 48px; color: var(--warning-color);"></i>
                </div>
                <h1 class="auth-title">Forgot Password?</h1>
                <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password</p>
            </div>
            
            <form id="forgotPasswordForm">
                <div class="mb-4">
                    <label for="email" class="form-label">
                        <i class="bi bi-envelope me-2"></i>Email Address
                    </label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your registered email" required>
                    <div class="invalid-feedback">
                        Please provide a valid email address.
                    </div>
                </div>
                
                <div class="d-grid mb-4">
                    <button type="submit" class="btn btn-primary-custom" id="sendResetBtn">
                        <i class="bi bi-send me-2"></i>Send Reset Link
                    </button>
                </div>
                
                <div id="successMessage" class="alert alert-success d-none" role="alert">
                    <i class="bi bi-check-circle me-2"></i>
                    Reset link has been sent to your email address!
                </div>
                
                <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                    <i class="bi bi-exclamation-circle me-2"></i>
                    Email address not found. Please try again.
                </div>
            </form>
            
            <div class="text-center">
                <p class="mb-2">Remember your password? <a href="login.html" class="link-custom">Back to Login</a></p>
                <p>Don't have an account? <a href="register.html" class="link-custom">Create Account</a></p>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Forgot Password Script -->
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(event) {
            event.preventDefault();
            event.stopPropagation();
            
            const form = event.target;
            const email = document.getElementById('email').value;
            const sendBtn = document.getElementById('sendResetBtn');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            // Hide previous messages
            successMsg.classList.add('d-none');
            errorMsg.classList.add('d-none');
            
            // Add validation
            form.classList.add('was-validated');
            
            if (form.checkValidity()) {
                // Simulate sending reset link
                sendBtn.disabled = true;
                sendBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Sending...';
                
                setTimeout(() => {
                    // Simulate success (in real app, this would be an API call)
                    successMsg.classList.remove('d-none');
                    sendBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Link Sent!';
                    
                    // Reset form after 3 seconds
                    setTimeout(() => {
                        form.reset();
                        form.classList.remove('was-validated');
                        successMsg.classList.add('d-none');
                        sendBtn.disabled = false;
                        sendBtn.innerHTML = '<i class="bi bi-send me-2"></i>Send Reset Link';
                    }, 3000);
                }, 1500);
            }
        });
    </script>
</body>
</html>
